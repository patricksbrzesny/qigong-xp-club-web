name: Deploy auf Hetzner Webhosting

# Lädt die statische Seite per SFTP (lftp mirror) auf Hetzner Webhosting hoch.
# Hetzner Webhosting S bietet SFTP/FTPS, aber keinen SSH-Shell-Login; rsync
# braucht auf der Gegenseite eine Shell und scheidet deshalb aus.
#
# Benötigte GitHub Secrets (Settings → Secrets and variables → Actions):
#   HETZNER_HOST      z. B. wwwXXX.your-server.de (aus konsoleH)
#   HETZNER_USER      FTP-Hauptbenutzer
#   HETZNER_PASSWORD  FTP-Passwort            (ODER HETZNER_SSH_KEY)
#   HETZNER_SSH_KEY   privater SFTP-Schlüssel (optional, statt Passwort)
#   HETZNER_PATH      Zielverzeichnis, z. B. public_html
# Optional:
#   HETZNER_KNOWN_HOSTS  Ausgabe von `ssh-keyscan -p 22 <HETZNER_HOST>`
#
# Fehlen die Secrets, wird der Upload übersprungen; der Lauf schlägt nicht fehl.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delete_remote:
        description: "Dateien auf dem Server löschen, die es im Repo nicht mehr gibt (mirror --delete)"
        type: boolean
        default: false

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets prüfen
        id: check
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          PASS: ${{ secrets.HETZNER_PASSWORD }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEST: ${{ secrets.HETZNER_PATH }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$DEST" ] && { [ -n "$PASS" ] || [ -n "$KEY" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy übersprungen::HETZNER_* Secrets fehlen. Siehe README, Abschnitt Deployment."
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Seite zusammenstellen (_site)
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'ci' --exclude '_site' \
            --exclude 'README.md' --exclude 'LICENSE' ./ _site/
          find _site -type f | sort

      - name: lftp installieren
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp openssh-client

      - name: Upload per SFTP
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          LFTP_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEST: ${{ secrets.HETZNER_PATH }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DELETE: ${{ github.event.inputs.delete_remote == 'true' && '--delete' || '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOSTCHECK="-o StrictHostKeyChecking=yes"
          else
            HOSTCHECK="-o StrictHostKeyChecking=accept-new"
          fi
          SSHCMD="ssh -a -x -p 22 $HOSTCHECK"
          if [ -n "${KEY:-}" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/hetzner && chmod 600 ~/.ssh/hetzner
            SSHCMD="$SSHCMD -i $HOME/.ssh/hetzner"
            AUTH="-u $USER,"
          else
            AUTH="--env-password -u $USER"
          fi
          lftp $AUTH "sftp://$HOST" -e "
            set sftp:connect-program '$SSHCMD';
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --only-newer --parallel=4 $DELETE --exclude-glob .DS_Store _site/ '$DEST/';
            bye"
          rm -f ~/.ssh/hetzner
